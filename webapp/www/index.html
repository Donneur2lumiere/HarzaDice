<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>HarzaDice</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    font-family: 'Segoe UI', 'DejaVu Sans', sans-serif;
    background: #111;
    color: #fff;
    height: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px;
  }

  /* === Barre de mode (portrait / paysage / plein écran) === */
  .barre-mode {
    display: flex;
    gap: 4px;
    margin-bottom: 8px;
    flex-shrink: 0;
  }
  .mode-btn {
    padding: 6px 14px;
    border: 1px solid #555;
    border-radius: 6px;
    background: #2c2c2c;
    color: #fff;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .mode-btn.actif { background: #16a085; border-color: #16a085; }

  /* === Cadre téléphone (simulation) === */
  .cadre-telephone {
    background: #1a1a1a;
    border: 4px solid #444;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: all 0.25s ease;
  }
  .cadre-telephone.portrait {
    width: 390px;
    height: 760px;
    max-width: 100%;
    max-height: calc(100vh - 60px);
  }
  .cadre-telephone.paysage {
    width: 760px;
    height: 390px;
    max-width: 100%;
    max-height: calc(100vh - 60px);
    flex-direction: row;
  }
  .cadre-telephone.plein {
    width: 100%;
    height: calc(100vh - 50px);
  }

  /* === Contenu du téléphone === */
  .contenu {
    display: flex;
    flex-direction: column;
    flex: 1;
    padding: 10px;
    overflow: hidden;
  }
  .paysage .contenu {
    flex-direction: row;
    align-items: stretch;
  }
  .paysage .zone-gauche {
    display: flex;
    flex-direction: column;
    width: 45%;
    padding-right: 8px;
  }
  .paysage .zone-droite {
    display: flex;
    flex-direction: column;
    flex: 1;
    padding-left: 8px;
    border-left: 1px solid #333;
  }

  .barre-arme {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    flex-wrap: wrap;
    justify-content: center;
    flex-shrink: 0;
  }
  .barre-arme label { font-size: 14px; font-weight: bold; }
  .barre-arme select {
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid #555;
    background: #2c2c2c;
    color: #fff;
    font-size: 14px;
  }

  .des-container {
    display: flex;
    gap: 4px;
    margin-bottom: 8px;
    flex-shrink: 0;
  }
  .paysage .des-container { flex-wrap: wrap; }
  .de-btn {
    flex: 1;
    min-height: 72px;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    transition: transform 0.1s;
  }
  .de-btn:active { transform: scale(0.95); }
  .de-btn .libelle { font-size: 12px; }
  .de-btn .compteur { font-size: 18px; font-weight: bold; }

  .actions {
    display: flex;
    gap: 4px;
    margin-bottom: 8px;
    flex-shrink: 0;
  }
  .action-btn {
    flex: 1;
    min-height: 46px;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    transition: transform 0.1s;
  }
  .action-btn:active { transform: scale(0.97); }
  .lancer-btn { background: #16a085; }
  .oubli-btn { background: #7f8c8d; }

  .resultats {
    flex: 1;
    text-align: center;
    padding: 12px 8px;
    overflow-y: auto;
  }
  #total {
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 4px;
  }
  #symboles {
    font-size: 22px;
    margin-bottom: 4px;
  }
  #detail {
    font-size: 16px;
    color: #bbb;
    word-wrap: break-word;
    margin-bottom: 8px;
    line-height: 1.6;
  }
  #effet {
    font-size: 13px;
    font-weight: bold;
    word-wrap: break-word;
    line-height: 1.4;
  }
  .effet-defenseur { color: #27ae60; }
  .effet-attaquant { color: #e74c3c; }
  .effet-erreur { color: #f39c12; }

  /* Sur mobile réel, on masque la barre de mode (le viewport gère l'orientation) */
  @media (max-width: 500px) {
    .barre-mode { display: none; }
    .cadre-telephone {
      width: 100% !important;
      height: 100vh !important;
      border: none;
      border-radius: 0;
    }
  }
</style>
</head>
<body>
  <div class="barre-mode">
    <button class="mode-btn actif" data-mode="portrait">📱 Portrait</button>
    <button class="mode-btn" data-mode="paysage">📱 Paysage</button>
    <button class="mode-btn" data-mode="plein">💻 Plein écran</button>
  </div>

  <div class="cadre-telephone portrait" id="telephone">
    <div class="contenu">
      <div class="zone-gauche">
        <div class="barre-arme">
          <label for="type-arme">Type d'arme :</label>
          <select id="type-arme">
            <option value="C">C (Courte)</option>
            <option value="M" selected>M (Moyenne)</option>
            <option value="D">D (Distante)</option>
          </select>
        </div>
        <div class="des-container" id="des-container"></div>
        <div class="actions">
          <button class="action-btn lancer-btn" id="btn-lancer">LANCER !</button>
          <button class="action-btn oubli-btn" id="btn-oubli">Oublie...</button>
        </div>
      </div>
      <div class="zone-droite">
        <div class="resultats">
          <div id="total"></div>
          <div id="symboles"></div>
          <div id="detail"></div>
          <div id="effet"></div>
        </div>
      </div>
    </div>
  </div>

<script src="harzadice_core.js"></script>
<script>
(function () {
  const compteurs = {};
  const derniereSelection = {};
  COULEURS.forEach(c => {
    compteurs[c.code] = 0;
    derniereSelection[c.code] = 0;
  });

  const desContainer = document.getElementById('des-container');
  const totalEl = document.getElementById('total');
  const symbolesEl = document.getElementById('symboles');
  const detailEl = document.getElementById('detail');
  const effetEl = document.getElementById('effet');
  const typeArmeEl = document.getElementById('type-arme');
  const telephone = document.getElementById('telephone');

  // Création des boutons de dés
  COULEURS.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'de-btn';
    btn.style.background = c.hex;
    if (c.code === 'O') btn.style.color = '#000';
    btn.innerHTML = '<span class="libelle">' + c.libelle + '</span><span class="compteur" id="cpt-' + c.code + '">0 dé(s)</span>';
    btn.addEventListener('click', () => incrementer(c.code));
    desContainer.appendChild(btn);
  });

  function incrementer(code) {
    compteurs[code]++;
    document.getElementById('cpt-' + code).textContent = compteurs[code] + ' dé(s)';
  }

  function rafraichirBoutons() {
    COULEURS.forEach(c => {
      document.getElementById('cpt-' + c.code).textContent = compteurs[c.code] + ' dé(s)';
    });
  }

  function effacerResultats() {
    totalEl.textContent = '';
    symbolesEl.textContent = '';
    detailEl.textContent = '';
    effetEl.textContent = '';
    effetEl.className = '';
  }

  // === Gestion des modes (portrait / paysage / plein écran) ===
  document.querySelectorAll('.mode-btn').forEach(b => {
    b.addEventListener('click', function () {
      document.querySelectorAll('.mode-btn').forEach(x => x.classList.remove('actif'));
      this.classList.add('actif');
      telephone.className = 'cadre-telephone ' + this.dataset.mode;
    });
  });

  document.getElementById('btn-oubli').addEventListener('click', function () {
    COULEURS.forEach(c => { compteurs[c.code] = 0; });
    rafraichirBoutons();
    effacerResultats();
  });

  document.getElementById('btn-lancer').addEventListener('click', function () {
    let selection = {};
    COULEURS.forEach(c => { selection[c.code] = compteurs[c.code]; });
    let totalSelection = COULEURS.reduce((s, c) => s + selection[c.code], 0);
    const aDerniere = COULEURS.some(c => derniereSelection[c.code] > 0);
    if (totalSelection === 0 && !aDerniere) {
      totalEl.textContent = 'Sélectionnez au moins un dé.';
      effetEl.className = 'effet-erreur';
      return;
    }
    if (totalSelection === 0 && aDerniere) {
      selection = {};
      COULEURS.forEach(c => { selection[c.code] = derniereSelection[c.code]; });
    } else {
      COULEURS.forEach(c => { derniereSelection[c.code] = selection[c.code]; });
    }
    effacerResultats();
    const typeArme = typeArmeEl.value;
    const res = lancerSelection(selection, typeArme);
    if (!res.resultats || res.resultats.length === 0) return;
    totalEl.textContent = 'Total = ' + res.total;
    if (res.symbolesRestants && res.symbolesRestants.length > 0) {
      symbolesEl.textContent = res.symbolesRestants.join(' ');
    }
    detailEl.textContent = res.resultats.map(r => String(r)).join('  ');
    if (res.partie) {
      effetEl.textContent = res.partie + ' : ' + res.effet;
      effetEl.className = res.partie === 'Défenseur' ? 'effet-defenseur' : 'effet-attaquant';
    }
  });
})();
</script>
</body>
</html>
