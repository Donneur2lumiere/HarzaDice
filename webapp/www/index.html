<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>HarzaDice</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    font-family: 'Segoe UI', 'DejaVu Sans', sans-serif;
    background: #111;
    color: #fff;
    height: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px;
  }

  /* === Barre de mode (portrait / paysage / plein écran) === */
  .barre-mode {
    display: flex;
    gap: 4px;
    margin-bottom: 8px;
    flex-shrink: 0;
  }
  .mode-btn {
    padding: 6px 14px;
    border: 1px solid #555;
    border-radius: 6px;
    background: #2c2c2c;
    color: #fff;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .mode-btn.actif { background: #16a085; border-color: #16a085; }

  /* === Cadre téléphone : fin en haut/côtés, épais en bas === */
  .cadre-telephone {
    background: #1a1a1a;
    border: 2px solid #444;
    border-bottom: 40px solid #444;
    border-radius: 8px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: all 0.25s ease;
  }
  .cadre-telephone.portrait {
    width: 390px;
    height: 760px;
    max-width: 100%;
    max-height: calc(100vh - 60px);
  }
  .cadre-telephone.paysage {
    width: 760px;
    height: 390px;
    max-width: 100%;
    max-height: calc(100vh - 60px);
    flex-direction: row;
  }
  .cadre-telephone.plein {
    width: 100%;
    height: calc(100vh - 50px);
    flex-direction: row;
  }
  .plein .contenu {
    flex-direction: row;
    align-items: stretch;
  }
  .plein .zone-gauche {
    display: flex;
    flex-direction: column;
    width: 60%;
    height: 100%;
    padding-right: 8px;
  }
  .plein .zone-droite {
    display: flex;
    flex-direction: column;
    flex: 1;
    height: 100%;
    padding-left: 8px;
    border-left: 1px solid #333;
  }

  /* === Contenu === */
  .contenu {
    display: flex;
    flex-direction: column;
    flex: 1;
    padding: 8px;
    padding-bottom: 4px;
    overflow: hidden;
  }
  .paysage .contenu {
    flex-direction: row;
    align-items: stretch;
  }
  .paysage .zone-gauche {
    display: flex;
    flex-direction: column;
    width: 60%;
    height: 100%;
    padding-right: 8px;
  }
  .paysage .zone-droite {
    display: flex;
    flex-direction: column;
    flex: 1;
    height: 100%;
    padding-left: 8px;
    border-left: 1px solid #333;
  }

  /* === Zone de commandes (arme + dés + actions) = >=75% hauteur (portrait) === */
  .zone-gauche {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }
  .portrait .zone-gauche { height: 78%; }
  /* Portrait : dés réduits, arme et actions agrandis (12:24:12) */
  .portrait .barre-arme { flex: 12 1 0; }
  .portrait .des-container { flex: 24 1 0; max-height: none; }
  .portrait .actions { flex: 12 1 0; }

  /* === Sélecteur d'arme : boutons radio poussoir === */
  .barre-arme {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
    flex: 0 1 auto;
  }
  .arme-btn {
    flex: 1;
    min-height: 60px;
    border: 2px solid #555;
    border-radius: 8px;
    background: #2c2c2c;
    color: #bbb;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    transition: all 0.15s;
  }
  .arme-btn:active { transform: scale(0.97); }
  /* État enfoncé (sélectionné) : couleur vive */
  .arme-btn.actif {
    border-color: #16a085;
    background: #16a085;
    color: #fff;
  }

  /* === Dés === */
  .des-container {
    display: flex;
    gap: 4px;
    flex: 1;
    align-items: stretch;
    min-height: 0;
  }
  .paysage .des-container, .plein .des-container { flex-wrap: wrap; }
  .de-btn {
    flex: 1;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    transition: transform 0.1s;
  }
  .de-btn:active { transform: scale(0.95); }
  .de-btn .libelle { font-size: 12px; }
  .de-btn .compteur { font-size: 18px; font-weight: bold; }

  /* === Actions LANCER / Oublie === */
  .actions {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
    flex: 0 1 auto;
  }
  .action-btn {
    flex: 1;
    min-height: 60px;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    transition: transform 0.1s;
  }
  .action-btn:active { transform: scale(0.97); }
  .lancer-btn { background: #16a085; }
  .oubli-btn { background: #7f8c8d; }

  /* === Zone résultats (<=22%) (portrait) === */
  .zone-droite {
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .portrait .zone-droite { height: 18%; }
  .resultats {
    flex: 1;
    text-align: center;
    padding: 6px 8px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  /* Ligne principale : Total = X & symboles  [detail] */
  #ligne-resultat {
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 4px;
    line-height: 1.3;
    word-wrap: break-word;
  }
  #ligne-resultat .detail-de {
    font-size: 16px;
    font-weight: normal;
    color: #bbb;
  }
  #effet {
    font-size: 16px;
    font-weight: bold;
    word-wrap: break-word;
    line-height: 1.3;
  }
  /* Portrait : police résultats indépendante et réduite */
  .portrait #ligne-resultat { font-size: 18px; }
  .portrait #ligne-resultat .detail-de { font-size: 12px; }
  .portrait #effet { font-size: 12px; }
  .effet-defenseur { color: #27ae60; }
  .effet-attaquant { color: #e74c3c; }
  .effet-erreur { color: #f39c12; }

  /* === Bouton Quitter dans la marge basse (40px) — visible uniquement en localhost === */
  .btn-quitter {
    position: absolute;
    bottom: 6px;
    left: 50%;
    transform: translateX(-50%);
    height: 26px;
    padding: 0 20px;
    border: none;
    border-radius: 13px;
    background: #555;
    color: #fff;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    display: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    z-index: 10;
  }
  .btn-quitter:active { background: #e74c3c; }
  .cadre-telephone { position: relative; }

  /* Sur mobile réel, on masque la barre de mode */
  @media (max-width: 500px) {
    .barre-mode { display: none; }
    .cadre-telephone {
      width: 100% !important;
      height: 100vh !important;
      border: 2px solid #444;
      border-bottom: 40px solid #444;
      border-radius: 8px;
    }
  }
</style>
</head>
<body>
  <div class="barre-mode">
    <button class="mode-btn actif" data-mode="portrait">📱 Portrait</button>
    <button class="mode-btn" data-mode="paysage">📱 Paysage</button>
    <button class="mode-btn" data-mode="plein">💻 Plein écran</button>
  </div>

  <div class="cadre-telephone portrait" id="telephone">
    <button class="btn-quitter" id="btn-quitter">Quitter</button>
    <div class="contenu">
      <div class="zone-gauche">
        <div class="barre-arme" id="arme-container"></div>
        <div class="des-container" id="des-container"></div>
        <div class="actions">
          <button class="action-btn lancer-btn" id="btn-lancer">LANCER !</button>
          <button class="action-btn oubli-btn" id="btn-oubli">Oublie...</button>
        </div>
      </div>
      <div class="zone-droite">
        <div class="resultats">
          <div id="ligne-resultat"></div>
          <div id="effet"></div>
        </div>
      </div>
    </div>
  </div>

<script src="harzadice_core.js"></script>
<script>
(function () {
  const compteurs = {};
  const derniereSelection = {};
  COULEURS.forEach(c => {
    compteurs[c.code] = 0;
    derniereSelection[c.code] = 0;
  });

  const armeContainer = document.getElementById('arme-container');
  const desContainer = document.getElementById('des-container');
  const ligneResultatEl = document.getElementById('ligne-resultat');
  const effetEl = document.getElementById('effet');
  const telephone = document.getElementById('telephone');

  let typeArme = 'M'; // arme par défaut

  // === Bouton Quitter : visible uniquement en localhost (PC), invisible sur APK ===
  const btnQuitter = document.getElementById('btn-quitter');
  if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
    btnQuitter.style.display = 'block';
    btnQuitter.addEventListener('click', function () {
      fetch('/quit').then(() => { window.close(); });
    });
  }

  // === Création des boutons d'arme (radio poussoir) ===
  const armes = [
    { code: 'C', libelle: 'Courte' },
    { code: 'M', libelle: 'Moyenne' },
    { code: 'D', libelle: 'Distante' },
  ];
  const armeBoutons = {};
  armes.forEach(a => {
    const btn = document.createElement('button');
    btn.className = 'arme-btn' + (a.code === 'M' ? ' actif' : '');
    btn.textContent = a.libelle;
    btn.dataset.arme = a.code;
    btn.addEventListener('click', function () {
      typeArme = a.code;
      Object.values(armeBoutons).forEach(b => b.classList.remove('actif'));
      this.classList.add('actif');
    });
    armeContainer.appendChild(btn);
    armeBoutons[a.code] = btn;
  });

  // === Création des boutons de dés ===
  COULEURS.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'de-btn';
    btn.style.background = c.hex;
    if (c.code === 'O') btn.style.color = '#000';
    btn.innerHTML = '<span class="libelle">' + c.libelle + '</span><span class="compteur" id="cpt-' + c.code + '">0 dé(s)</span>';
    btn.addEventListener('click', () => incrementer(c.code));
    desContainer.appendChild(btn);
  });

  function incrementer(code) {
    compteurs[code]++;
    document.getElementById('cpt-' + code).textContent = compteurs[code] + ' dé(s)';
  }

  function rafraichirBoutons() {
    COULEURS.forEach(c => {
      document.getElementById('cpt-' + c.code).textContent = compteurs[c.code] + ' dé(s)';
    });
  }

  function effacerResultats() {
    ligneResultatEl.textContent = '';
    effetEl.textContent = '';
    effetEl.className = '';
  }

  // === Gestion des modes ===
  document.querySelectorAll('.mode-btn').forEach(b => {
    b.addEventListener('click', function () {
      document.querySelectorAll('.mode-btn').forEach(x => x.classList.remove('actif'));
      this.classList.add('actif');
      telephone.className = 'cadre-telephone ' + this.dataset.mode;
    });
  });

  document.getElementById('btn-oubli').addEventListener('click', function () {
    COULEURS.forEach(c => { compteurs[c.code] = 0; });
    rafraichirBoutons();
    effacerResultats();
  });

  document.getElementById('btn-lancer').addEventListener('click', function () {
    let selection = {};
    COULEURS.forEach(c => { selection[c.code] = compteurs[c.code]; });
    let totalSelection = COULEURS.reduce((s, c) => s + selection[c.code], 0);
    const aDerniere = COULEURS.some(c => derniereSelection[c.code] > 0);
    if (totalSelection === 0 && !aDerniere) {
      ligneResultatEl.textContent = 'Sélectionnez au moins un dé.';
      effetEl.className = 'effet-erreur';
      return;
    }
    if (totalSelection === 0 && aDerniere) {
      selection = {};
      COULEURS.forEach(c => { selection[c.code] = derniereSelection[c.code]; });
    } else {
      COULEURS.forEach(c => { derniereSelection[c.code] = selection[c.code]; });
    }
    effacerResultats();
    const res = lancerSelection(selection, typeArme);
    if (!res.resultats || res.resultats.length === 0) return;
    // Ligne principale : Total = X & ☠  [★ 0 ☠ ☠ 1]
    let ligne = 'Total = ' + res.total;
    if (res.symbolesRestants && res.symbolesRestants.length > 0) {
      ligne += ' & ' + res.symbolesRestants.join(' ');
    }
    if (res.resultats.length > 0) {
      ligne += '  <span class="detail-de">[' + res.resultats.map(r => String(r)).join(' ') + ']</span>';
    }
    ligneResultatEl.innerHTML = ligne;
    if (res.partie) {
      effetEl.textContent = res.partie + ' : ' + res.effet;
      effetEl.className = res.partie === 'Défenseur' ? 'effet-defenseur' : 'effet-attaquant';
    }
  });
})();
</script>
</body>
</html>
